<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trackmania 2020 Item Studio</title>
    <base href="/" />
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Three.js (r128) & Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>

<body class="bg-dark text-white m-0 p-0 overflow-hidden">
    <div id="app">
        <div class="d-flex flex-column align-items-center justify-content-center vh-100">
            <div class="spinner-border text-info mb-3" role="status"></div>
            <h5 class="fw-light">Loading Trackmania 2020 Item Studio...</h5>
        </div>
    </div>

    <div id="blazor-error-ui" class="d-none">
        An error occurred. Reload the page.
    </div>

    <!-- Blazor WASM Runtime -->
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- 3D Viewport Script -->
    <script src="js/meshViewer.js?v=5"></script>
</body>

</html>
